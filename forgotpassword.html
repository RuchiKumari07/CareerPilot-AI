<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareerPilot AI - Forgot Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0a0a0f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:420px;
background:#111118;
padding:35px;
border-radius:15px;
box-shadow:0 0 20px rgba(124,92,252,.2);
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#7c5cfc;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:13px;
margin:10px 0;
background:#1a1a24;
border:none;
border-radius:8px;
color:white;
font-size:15px;
outline:none;
}

input:focus{
border:1px solid #7c5cfc;
}

button{
width:100%;
padding:13px;
margin-top:10px;
background:#7c5cfc;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#5d3df7;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.success{
color:#4ecdc4;
margin-top:15px;
text-align:center;
}

.error{
color:#ff6b6b;
margin-top:15px;
text-align:center;
}

a{
color:#7c5cfc;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
CareerPilot AI
</div>

<h2>Forgot Password</h2>

<input
type="email"
id="email"
placeholder="Enter Registered Email">

<button
id="otpBtn"
onclick="sendOTP()">

Send OTP

</button>

<input
type="text"
id="otp"
placeholder="Enter OTP">

<button
onclick="verifyOTP()">

Verify OTP

</button>

<input
type="password"
id="newPassword"
placeholder="New Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button
onclick="resetPassword()">

Reset Password

</button>

<p class="success" id="success"></p>

<p class="error" id="error"></p>

<div style="text-align:center;margin-top:20px;">

<a href="login.html">

⬅ Back to Login

</a>

</div>

</div>

<script>

let otpVerified = false;

// ---------------- SEND OTP ----------------

async function sendOTP(){

const email =
document.getElementById("email").value.trim();

const success =
document.getElementById("success");

const error =
document.getElementById("error");

success.innerHTML="";
error.innerHTML="";

if(email==""){

error.innerHTML="Please enter your registered email.";

return;

}

try{

const response = await fetch(
"https://careerpilot-ai-voux.onrender.com/login/send-otp",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email

})

}

);

const data = await response.json();

if(data.success){

success.innerHTML=data.message;

}
else{

error.innerHTML=data.message;

}

}

catch(err){

error.innerHTML="Server Error";

}

}

// ---------------- VERIFY OTP ----------------

async function verifyOTP(){

const email =
document.getElementById("email").value.trim();

const otp =
document.getElementById("otp").value.trim();

const success =
document.getElementById("success");

const error =
document.getElementById("error");

success.innerHTML="";
error.innerHTML="";

if(email=="" || otp==""){

error.innerHTML="Please enter email and OTP.";

return;

}

try{

const response = await fetch(

"https://careerpilot-ai-voux.onrender.com/verify-otp",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,

otp:otp

})

}

);

const data = await response.json();

if(data.success){

otpVerified=true;

success.innerHTML=data.message;

}
else{

error.innerHTML=data.message;

}

}

catch(err){

error.innerHTML="Server Error";

}

}

// ---------------- RESET PASSWORD ----------------

async function resetPassword(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("newPassword").value;

const confirm =
document.getElementById("confirmPassword").value;

const success =
document.getElementById("success");

const error =
document.getElementById("error");

success.innerHTML="";
error.innerHTML="";

if(!otpVerified){

error.innerHTML="Please verify OTP first.";

return;

}

if(password=="" || confirm==""){

error.innerHTML="Please enter password.";

return;

}

if(password!=confirm){

error.innerHTML="Passwords do not match.";

return;

}

try{

const response = await fetch(

"https://careerpilot-ai-voux.onrender.com/reset-password",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,

password:password

})

}

);

const data = await response.json();

if(data.success){

alert("Password Reset Successfully");

window.location="login.html";

}
else{

error.innerHTML=data.message;

}

}

catch(err){

error.innerHTML="Server Error";

}

}

</script>

</body>
</html>
