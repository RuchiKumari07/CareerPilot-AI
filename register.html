<!DOCTYPE html>
<html>
<head>
<title>CareerPilot AI-Register</title>

<style>
body{
background:#0a0a0f;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:350px;
padding:30px;
background:#111118;
border-radius:15px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
background:#1a1a24;
border:none;
color:white;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#7c5cfc;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

a{
color:#7c5cfc;
}
</style>
</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="register()">Register</button>

<p>
Already have account?
<a href="login.html">Login</a>
</p>

</div>

<script>

async function register(){

const user={

name:document.getElementById("name").value,

email:document.getElementById("email").value,

password:document.getElementById("password").value

};


const response = await fetch(
"https://careerpilot-ai-voux.onrender.com/register",
{
method:"POST",


headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(user)

});


const result = await response.json();


if(result.success){

alert("Registration Successful");

window.location="/login";

}

else{

alert(result.error);

}

}
</script>

</body>
</html>
