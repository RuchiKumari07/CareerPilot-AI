<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATS Improvement</title>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0a0a0f;
color:white;
}

.navbar{
height:70px;
background:#111118;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 35px;
box-shadow:0 0 10px rgba(0,0,0,.4);
}

.logo{
font-size:28px;
font-weight:bold;
color:#7c5cfc;
}

.backBtn{
padding:10px 20px;
background:#7c5cfc;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

.container{
width:90%;
margin:auto;
padding:40px 0;
}

h1{
margin-bottom:20px;
}

#candidate{
margin:20px 0;
font-size:20px;
color:#4ecdc4;
}

#loading{
margin:20px 0;
font-size:18px;
color:#f5c842;
}

.card{
background:#111118;
padding:25px;
border-radius:15px;
margin-top:25px;
line-height:1.8;
font-size:16px;
white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        ResumeX AI
    </div>

    <button class="backBtn"
    onclick="window.location='/dashboard'">

        Dashboard

    </button>

</div>

<div class="container">

    <h1>🤖 AI ATS Improvement</h1>

    <p>
        AI will analyze your latest uploaded resume and provide ATS improvement suggestions.
    </p>

    <p id="candidate"></p>

    <p id="loading"></p>

    <div id="result"></div>

</div>
<script>

window.onload = loadATS;

async function loadATS(){

    document.getElementById("loading").innerHTML =
    "🤖 AI is analyzing your latest resume...";

    try{

        const response = await fetch(
            "https://careerpilot-ai-1-wdck.onrender.com/ats-improvement",
            {
                method:"GET",
                credentials:"include"
            }
        );

        const data = await response.json();

        document.getElementById("loading").innerHTML = "";

        console.log(data);

        if(!data.success){

            document.getElementById("result").innerHTML =
            `
            <div class="card">
                ${data.message}
            </div>
            `;
            return;

        }

        document.getElementById("candidate").innerHTML =
        "<b>Candidate :</b> " + data.name;

        document.getElementById("result").innerHTML =
        `
        <div class="card">

            ${data.improvement.replace(/\n/g,"<br>")}

            <br><br>

            <button onclick="copyReport()"
            style="
                padding:10px 20px;
                background:#7c5cfc;
                color:white;
                border:none;
                border-radius:8px;
                cursor:pointer;
                margin-right:10px;
            ">
                📋 Copy Report
            </button>

            <button onclick="window.print()"
            style="
                padding:10px 20px;
                background:#4ecdc4;
                color:black;
                border:none;
                border-radius:8px;
                cursor:pointer;
            ">
                🖨 Print
            </button>

        </div>
        `;

    }

    catch(error){

    console.log("REAL ERROR:", error);

    document.getElementById("loading").innerHTML = "";

    document.getElementById("result").innerHTML =
    `
    <div class="card">
        ${error.message}
    </div>
    `;



    }

}

function copyReport(){

    const text =
    document.getElementById("result").innerText;

    navigator.clipboard.writeText(text);

    alert("ATS Report Copied Successfully.");

}

</script>

</body>

</html>
